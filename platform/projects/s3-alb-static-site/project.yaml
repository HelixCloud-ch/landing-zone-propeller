name: s3-alb-static-site
description: >-
  Private S3 bucket fronted by an ALB via an S3 interface VPC endpoint.
  Owns the bucket and its aws:SourceVpce-gated policy. The ALB target group
  that reaches the bucket is a separate, shared resource; see the
  s3-alb-target-group project.

metadata:
  cost-center: platform

deploy:
  type: just
