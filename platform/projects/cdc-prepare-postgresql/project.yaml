name: cdc-prepare-postgresql
description: >-
  Prepares an RDS for PostgreSQL source database for Debezium CDC: verifies
  logical-replication preconditions, creates a least-privilege CDC role and its
  publication, and resolves its credential from two named scalar SecureString
  parameters, one for the username and one for the password (each a source of
  truth if present, created if absent; no rotation). Justfile-only, no
  Terraform state.

metadata:
  cost-center: platform

deploy:
  type: just
