name: eks-cluster
description: >-
  Generic Amazon EKS cluster. Creates the control plane, cluster IAM role, and
  an OIDC provider for IRSA by default. Optionally creates Fargate profiles
  (fargate_profiles) and/or EC2 managed node groups (node_groups) for mixed-mode
  or single-mode compute. Supports sleep/wake via scale-to-zero for node groups.

metadata:
  cost-center: platform

deploy:
  type: just
