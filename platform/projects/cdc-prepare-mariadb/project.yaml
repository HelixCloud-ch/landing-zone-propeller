name: cdc-prepare-mariadb
description: >-
  Prepares a MariaDB source database for Debezium CDC: verifies binary-logging
  preconditions, creates a least-privilege CDC user, and resolves its
  credential from two named scalar SecureString parameters, one for the
  username and one for the password (each a source of truth if present, created
  if absent; no rotation). Justfile-only, no Terraform state.

metadata:
  cost-center: platform

deploy:
  type: just
