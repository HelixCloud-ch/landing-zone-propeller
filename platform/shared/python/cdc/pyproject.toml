# Python env for the CDC projects (cdc-prepare-mariadb, cdc-prepare-oracle,
# cdc-prepare-postgresql, cdc-topics). Bake it into the deploy-runner image
# with python_envs.cdc; the projects run through py-run. A new dependency here
# (psycopg, psycopg-binary) needs an image rebuild.
[project]
name = "cdc"
version = "0"
requires-python = ">=3.14"
dependencies = [
  "boto3==1.43.123",
  "kafka-python==3.0.12",
  "oracledb==26.1.0",
  "psycopg==3.3.9",
  "psycopg-binary==3.3.9",
  "pymysql==1.2.3",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false
