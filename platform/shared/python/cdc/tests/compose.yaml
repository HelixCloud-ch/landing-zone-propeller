# Local services for the CDC integration tests (test_integration.py).
# Start: just cdc-up   Stop: just cdc-down   Run all: just test-cdc-integration
name: cdc-integration

services:
  mariadb:
    image: mariadb:11.4
    command: [--log-bin=binlog, --binlog-format=ROW, --binlog-row-image=FULL]
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
    ports: ["33306:3306"]
    volumes:
      - ./mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      retries: 30

  postgresql:
    # Logical WAL on, like RDS with rds.logical_replication=1. No TLS: tests use ssl_mode disable.
    image: postgres:17-alpine
    command: [postgres, -c, wal_level=logical]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpw
      POSTGRES_DB: appdb
    ports: ["35432:5432"]
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # The entrypoint starts a temporary server for the init scripts, then restarts.
      # Checking the TCP port as the app user finds only the final server.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U admin -d appdb]
      interval: 2s
      retries: 30

  oracle:
    # A CDB with the FREEPDB1 pluggable database. First start takes about a minute.
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: syspw
    ports: ["31521:1521"]
    volumes:
      - ./oracle-init.sh:/container-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # Healthy only after the init script finished (it restarts the database).
      test: [CMD-SHELL, test -f /tmp/cdc-ready && healthcheck.sh]
      interval: 5s
      start_period: 60s
      retries: 60

  kafka:
    # Single KRaft node; PLAINTEXT on localhost:9092 (the image default).
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list]
      interval: 3s
      retries: 30
