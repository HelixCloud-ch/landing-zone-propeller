# Test env for python envs in the image (python_envs) and the py-run recipe.
# PyYAML is chosen because it ships compiled wheels: this proves the image
# resolves platform-specific wheels, not only pure-Python ones.
[project]
name = "python-smoke"
version = "0"
requires-python = ">=3.14"
dependencies = ["pyyaml==6.0.3"]

[tool.uv]
package = false
